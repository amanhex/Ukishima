name: Ukishima issue
description: Report a bug, installation problem, or request a change
title: "[Ukishima] "
body:
  - type: markdown
    attributes:
      value: |
        Include the details that help reproduce or understand the issue. You can attach screenshots and log files in the fields below.

  - type: dropdown
    id: category
    attributes:
      label: Issue type
      options:
        - Bug
        - Installation or update problem
        - Feature request
        - Other
    validations:
      required: true

  - type: input
    id: summary
    attributes:
      label: Short summary
      placeholder: What is the issue about?
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Description
      description: What happened, what did you expect, or what would you like to change?
      placeholder: Describe the issue and include reproduction steps if relevant.
    validations:
      required: true

  - type: dropdown
    id: compositor
    attributes:
      label: Compositor
      description: Where does the issue happen?
      options:
        - Hyprland
        - niri
        - Both
        - Neither / not sure

  - type: input
    id: system
    attributes:
      label: System details (optional)
      description: Linux distribution and Quickshell version, if known.
      placeholder: e.g. Arch Linux, Quickshell 0.3.x

  - type: upload
    id: screenshot
    attributes:
      label: Screenshots (optional)
      description: Upload screenshots or short screen recordings that help explain the issue.
    validations:
      required: false
      accept: ".png,.jpg,.jpeg,.gif,.webp,.mp4,.webm,.mov"

  - type: upload
    id: logs
    attributes:
      label: Logs (optional)
      description: >-
        Upload the log file if relevant. By default it is
        ~/.local/state/ukishima/ukishima.log (or under $XDG_STATE_HOME), with
        the previous rotated log at ukishima.log.1. Check attachments for
        private paths or other sensitive details before sharing.
    validations:
      required: false
      accept: ".log,.txt,.zip,.gz"

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I checked that attached screenshots and logs do not expose information I want to keep private.
          required: true
